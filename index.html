    .btn-viz {
      --viz-ui:#00ffe1;
      --viz-ui-soft:rgba(0,255,225,0.32);
      color:var(--viz-ui);
      background:rgba(8,8,10,0.82);
      border:1.5px solid var(--viz-ui);
      border-radius:999px;
      padding:12px 20px;
      text-shadow:0 0 14px var(--viz-ui-soft);
      box-shadow:0 0 20px var(--viz-ui-soft), inset 0 0 22px var(--viz-ui-soft);
      transition:border-color 0.3s, color 0.3s, text-shadow 0.3s, box-shadow 0.3s;
    }
    .btn-viz:hover {
      color:#fff;
      filter:brightness(1.08);
    }
    .btn-viz:focus-visible {
      outline:2px solid var(--viz-ui);
      outline-offset:3px;
    }

    .play-btn {
      width:60px; height:60px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.48);
      color:#fff;
      display:flex; align-items:center; justify-content:center;
      padding:0;
      background:rgba(12,12,14,0.55);
      box-shadow:0 0 0 1px rgba(0,0,0,0.45), 0 6px 28px rgba(0,0,0,0.5), 0 0 24px rgba(0,255,225,0.14);
      transition:all 0.2s;
    }
    .play-btn .play-icon {
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:0;
    }
    .play-btn .play-icon svg {
      width:1.15rem;
      height:1.15rem;
      display:block;
    }
    .play-btn .play-icon--pause { display:none; }
    .play-btn.is-playing .play-icon--play { display:none; }
    .play-btn.is-playing .play-icon--pause { display:flex; }
    .play-btn:hover {
      border-color:var(--accent);
      color:var(--accent);
      box-shadow:0 0 28px rgba(0,255,225,0.32), 0 6px 28px rgba(0,0,0,0.45);
    }
    .play-btn:focus-visible {
      outline:2px solid var(--accent);
      outline-offset:4px;
    }

    @media(max-width:500px) {
      .top-left { flex-direction:column; align-items:stretch; }
      .catalogue-wrap {
        width:100%;
        max-width:100%;
        align-self:stretch;
      }
      .catalogue-fieldset { width:100%; min-width:0; }
      .catalogue-scroll { display:none !important; }
      .catalogue-mobile-open { display:flex; }
      .track-name { max-width:100%; }
      .subtitle { bottom:232px; }
      .search-wrap--desktop { display:none !important; }
      .btn-search-open { display:inline-flex; }
      .ctrl-row {
        flex-wrap:nowrap;
        justify-content:flex-start;
        gap:8px 10px;
        overflow-x:auto;
        overflow-y:hidden;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;
        padding-bottom:2px;
        scrollbar-width:none;
      }
      .ctrl-row::-webkit-scrollbar { display:none; }
      .ctrl-row .ctrl-text {
        position:absolute;
        width:1px;
        height:1px;
        padding:0;
        margin:-1px;
        overflow:hidden;
        clip:rect(0,0,0,0);
        white-space:nowrap;
        border:0;
      }
      .ctrl-row .ctrl-icon {
        display:inline-flex;
        align-items:center;
        justify-content:center;
        line-height:0;
      }
      .ctrl-row .btn-transport { padding:10px 12px; min-width:48px; }
      .ctrl-row .btn-viz { padding:10px 14px; min-width:48px; }
      .ctrl-row .btn-search-open { padding:10px 12px; min-width:48px; min-height:48px; }
      .ctrl-row .play-btn { width:52px; height:52px; min-width:52px; flex-shrink:0; }
      .modal { width:100%; max-height:85vh; }
    }

    @media(max-width:380px) {
      .top { padding:12px 16px; }
      .bottom { padding:12px 16px 20px; }
    }
  </style>
</head>
<body>

<div class="modal-backdrop" id="catalogueMobileBackdrop" onclick="closeCatalogueMobileModal()"></div>

  <div class="modal-header">

      <button type="button" class="modal-restore-btn" onclick="clearDjSet()" aria-label="Clear your set">Clear</button>

</div>

<div class="bottom">
  <div class="track-row">
    <div>
      <div class="track-name" id="trackName">Loading…</div>
      <div class="track-artist" id="trackArtist">MRMELO VIBES</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:0.55rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;" id="trackNum">—</div>
    </div>
  </div>
  <div class="prog-row">
    <span class="t-label" id="tEl">0:00</span>
    <div class="prog-bar" id="progBar">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <span class="t-label" id="tDur">0:00</span>
  </div>
  <div class="ctrl-row">
    <div class="search-wrap search-wrap--ctrl search-wrap--desktop">
      <label for="searchInput">Search</label>
      <input type="text" id="searchInput" class="search-input" placeholder="Song or artist…" autocomplete="off" aria-label="Search songs by title or artist">
    </div>
    <button type="button" class="btn btn-transport btn-search-open" id="searchOpenBtn" onclick="openCatalogSearch()" aria-label="Search catalogue" title="Search songs"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button type="button" class="btn btn-transport" onclick="prevTrack()" aria-label="Previous track" title="Previous track"><span class="ctrl-text">Prev</span><span class="ctrl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14"/><path d="M11 5v14l9-7-9-7z"/></svg></span></button>
    <button type="button" class="btn play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play" title="Play"><span class="play-icon play-icon--play" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="play-icon play-icon--pause" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg></span></button>
    <button type="button" class="btn btn-transport" onclick="nextTrack()" aria-label="Next track" title="Next track"><span class="ctrl-text">Next</span><span class="ctrl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5v14"/><path d="M5 12l9-7v14L5 12z"/></svg></span></button>
    <button type="button" class="btn btn-transport" onclick="shuffle()" id="shuffleBtn" aria-label="Shuffle queue" title="Shuffle queue"><span class="ctrl-text">Shuffle</span><span class="ctrl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h5v5M4 20l16-16M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></span></button>
    <button type="button" class="btn btn-viz" onclick="cycleViz()" id="vizBtn" aria-label="Visualization: Bars" title="Visualization: Bars (keyboard V)"><span class="ctrl-text" id="vizBtnText">Bars</span><span class="ctrl-icon" id="vizBtnIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V8M12 18v-8M18 18V4"/></svg></span></button>
    <button type="button" class="btn btn-transport" id="upNextBtn" onclick="openUpNext()" aria-label="Open Up Next queue" title="Up Next"><span class="ctrl-text">Up Next</span><span class="ctrl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1" fill="currentColor" stroke="none"/></svg></span></button>
    <button type="button" class="btn btn-transport" id="djSetBtn" onclick="openDjSet()" aria-label="Open your DJ set" title="Your DJ set"><span class="ctrl-text">Set <span id="djSetBadge">0</span></span><span class="ctrl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span></button>
  </div>
</div>

<audio id="audio" playsinline webkit-playsinline preload="metadata"></audio>

<script>
let ALL_TRACKS = [];
let playlist = [];
let queue = [];
let trackIdx = 0;
let upNextActiveIndex = 0;
let isPlaying = false;
let isShuffled = false;
let djSet = [];
try { djSet = JSON.parse(localStorage.getItem('mrmelo_djset') || '[]'); } catch (_) { djSet = []; }
function saveDjSet() { try { localStorage.setItem('mrmelo_djset', JSON.stringify(djSet)); } catch (_) {} }
function inDjSet(file) { return djSet.includes(file); }
function toggleDjSet(file) {
  const i = djSet.indexOf(file);
  if (i === -1) djSet.push(file); else djSet.splice(i, 1);
  saveDjSet();
}

const MODES = ['Bars','Wave','Radial'];
const VIZ_SVG_HTML = [
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V8M12 18v-8M18 18V4"/></svg>',
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.2-3 4.3-3 6.5 0s4.3 3 6.5 0 4.3-3 6.5 0"/></svg>',
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>'
];
let modeIdx = 0;
let colorOff = 0;

async function loadPlaylist() {
  try {
    const r = await fetch('playlist.json');
    ALL_TRACKS = await r.json();
    applyCatalogue();
  } catch (e) {
    document.getElementById('trackName').textContent = 'No playlist found. Add playlist.json.';
    playlist = [];
    queue = [];
  }
}

function applyCatalogue() {
  const cat = document.getElementById('catalogue').value;
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  playlist = cat
    ? ALL_TRACKS.filter(t => t.catalogue === cat)
    : [...ALL_TRACKS];
  if (q) {
    playlist = playlist.filter(t =>
      (t.title && t.title.toLowerCase().includes(q)) ||
      (t.artist && t.artist.toLowerCase().includes(q))
    );
  }
  queue = [...playlist];
  trackIdx = 0;
  if (queue.length > 0) {
    loadTrack(0);
    document.getElementById('genreWatermark').textContent = cat || 'All';
    const tag = document.getElementById('genreTag');
    tag.classList.add('show');
    setTimeout(() => tag.classList.remove('show'), 3000);
  } else {
    document.getElementById('trackName').textContent = q
      ? 'No tracks match your search'
      : 'No tracks in this catalogue';
  }
}

function loadTrack(i) {
  if (!queue[i]) return;
  cancelFade();
  trackIdx = i;
  const t = queue[i];
  renderTrackMeta(i);
  audio.volume = 1;
  audio.crossOrigin = t.file.startsWith('http') ? null : 'anonymous';
  audio.src = t.file;
  audio.load();
  if (isPlaying) {
    audio.play().catch((e) => {
      if (e && e.name === 'NotAllowedError') {
        isPlaying = false;
        setPlayButtonVisual(false);
        const p = document.getElementById('playBtn');
        p.setAttribute('aria-label', 'Play');
        p.setAttribute('title', 'Play');
      }
    });
  }
}

function renderTrackMeta(i) {
  const t = queue[i];
  if (!t) return;
  document.getElementById('trackName').textContent = t.title;
  document.getElementById('trackArtist').textContent = t.artist + ' · ' + t.catalogue;
  document.getElementById('trackNum').textContent = (i + 1) + ' / ' + queue.length;
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('tEl').textContent = '0:00';
  document.getElementById('tDur').textContent = '0:00';
  document.getElementById('subtitle').classList.remove('show');
  document.getElementById('subtitleQuote').textContent = '';
  document.getElementById('subtitleSig').textContent = t.figure ? '— ' + t.figure : '— Mr. Melo';
  setTimeout(() => {
    // only show if this track is still the current one (guards against fast skips)
    if (queue[trackIdx] && queue[trackIdx].file === t.file) {
      document.getElementById('subtitleQuote').textContent = t.reflection || '';
      if (t.reflection) document.getElementById('subtitle').classList.add('show');
    }
  }, 600);
}

function showSubtitle(text) {
  const el = document.getElementById('subtitle');
  const q = document.getElementById('subtitleQuote');
  el.classList.remove('show');
  setTimeout(() => {
    q.textContent = text;
    if (text) el.classList.add('show');
  }, 300);
}

function nextTrack() {
  if (!queue.length) return;
  if (isFading) { cancelFade(); return; }   // fade is already moving to the next track — settle there
  loadTrack((trackIdx + 1) % queue.length);
}

function prevTrack() {
  if (!queue.length) return;
  if (isFading) cancelFade();
  loadTrack((trackIdx - 1 + queue.length) % queue.length);
}

function setPlayButtonVisual(playing) {
  const pb = document.getElementById('playBtn');
  if (!pb) return;
  pb.classList.toggle('is-playing', playing);
}

function togglePlay() {
  isPlaying = !isPlaying;
  const pb = document.getElementById('playBtn');
  setPlayButtonVisual(isPlaying);
  pb.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  pb.setAttribute('title', isPlaying ? 'Pause' : 'Play');
  if (isPlaying) {
    audio.play().catch((e) => {
      if (e && e.name === 'NotAllowedError') {
        isPlaying = false;
        setPlayButtonVisual(false);
        pb.setAttribute('aria-label', 'Play');
        pb.setAttribute('title', 'Play');
      }
    });
  } else {
    if (isFading) cancelFade();
    audio.pause();
    idleDeck.pause();
  }
}

function shuffle() {
  if (!queue.length) return;
  isShuffled = !isShuffled;
  document.getElementById('shuffleBtn').classList.toggle('glow', isShuffled);
  if (isShuffled) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
  } else {
    queue = [...playlist];
  }
  loadTrack(0);
}

function setVizButtonDisplay() {
  const mode = MODES[modeIdx];
  const btn = document.getElementById('vizBtn');
  const textEl = document.getElementById('vizBtnText');
  const iconEl = document.getElementById('vizBtnIcon');
  if (textEl) textEl.textContent = mode;
  if (iconEl) iconEl.innerHTML = VIZ_SVG_HTML[modeIdx] || '';
  if (btn) {
    btn.setAttribute('aria-label', 'Visualization: ' + mode);
    btn.setAttribute('title', 'Visualization: ' + mode + ' (keyboard V)');
  }
}

function cycleViz() {
  modeIdx = (modeIdx + 1) % MODES.length;
  setVizButtonDisplay();
  syncVizButtonAccent();
}

function playNext(queueIndex) {
  if (!queue[queueIndex]) return;
  const t = queue[queueIndex];
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  const insertAt = trackIdx + 1;
  queue.splice(insertAt, 0, t);
  if (queueIndex === trackIdx) loadTrack(trackIdx);
  refreshUpNextList();
}

function addToEnd(queueIndex) {
  if (!queue[queueIndex]) return;
  const t = queue[queueIndex];
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  queue.push(t);
  if (queueIndex === trackIdx) loadTrack(trackIdx);
  refreshUpNextList();
}

function removeFromQueue(queueIndex) {
  if (!queue[queueIndex]) return;
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  if (queue.length === 0) {
    trackIdx = 0;
    document.getElementById('trackName').textContent = 'Queue empty';
    document.getElementById('trackArtist').textContent = '—';
    document.getElementById('trackNum').textContent = '0 / 0';
    audio.pause();
    isPlaying = false;
    setPlayButtonVisual(false);
    const p = document.getElementById('playBtn');
    p.setAttribute('aria-label', 'Play');
    p.setAttribute('title', 'Play');
  } else {
    if (queueIndex === trackIdx || trackIdx >= queue.length) {
      trackIdx = Math.min(trackIdx, queue.length - 1);
      loadTrack(trackIdx);
    }
  }
  refreshUpNextList();
  if (queue.length === 0) closeUpNext();
}

function restoreQueueOrder() {
  const currentTrack = queue[trackIdx];
  queue = [...playlist];
  if (queue.length === 0) return;
  const idx = currentTrack ? queue.findIndex((t) => t.file === currentTrack.file) : -1;
  trackIdx = idx >= 0 ? idx : 0;
  loadTrack(trackIdx);
  refreshUpNextList();
}

function moveQueueItem(fromIdx, toIdx) {
  if (fromIdx === toIdx || !queue[fromIdx]) return;
  const item = queue.splice(fromIdx, 1)[0];
  const insertIdx = fromIdx < toIdx ? toIdx - 1 : toIdx;
  queue.splice(insertIdx, 0, item);
  if (fromIdx === trackIdx) {
    trackIdx = insertIdx;
  } else if (fromIdx < trackIdx) {
    trackIdx = insertIdx >= trackIdx ? trackIdx - 1 : trackIdx;
  } else {
    trackIdx = insertIdx <= trackIdx ? trackIdx + 1 : trackIdx;
  }
  refreshUpNextList();
}

  list.querySelectorAll('.modal-track').forEach((row) => {

      (t.artist && t.artist.toLowerCase().includes(q)) ||
      (t.catalogue && t.catalogue.toLowerCase().includes(q));

// ---- Dual-deck playback engine (crossfade) ----
let audio = document.getElementById('audio');   // active deck
let idleDeck = audio.cloneNode(false);          // second deck
idleDeck.id = 'audio2';
audio.parentNode.insertBefore(idleDeck, audio.nextSibling);

let djCrossfade = true;    // natural fade between tracks
const CROSSFADE_SEC = 6;   // fade length in seconds
let isFading = false;

function cancelFade() {
  if (!isFading) return;
  isFading = false;
  idleDeck.pause();
  idleDeck.volume = 1;
  try { idleDeck.currentTime = 0; } catch (_) {}
  audio.volume = 1;
}

function maybeStartCrossfade() {
  if (!djCrossfade || isFading || !isPlaying) return;
  if (!audio.duration || isNaN(audio.duration)) return;
  if (queue.length < 2) return;
  const fadeLen = Math.min(CROSSFADE_SEC, audio.duration / 2);
  if (audio.duration - audio.currentTime <= fadeLen) startCrossfade(fadeLen);
}

function startCrossfade(fadeLen) {
  const nextIndex = (trackIdx + 1) % queue.length;
  const t = queue[nextIndex];
  if (!t) return;
  isFading = true;
  const outgoing = audio;
  const incoming = idleDeck;
  incoming.crossOrigin = t.file.startsWith('http') ? null : 'anonymous';
  incoming.src = t.file;
  incoming.load();
  incoming.volume = 0;
  try { incoming.currentTime = 0; } catch (_) {}
  incoming.play().catch(() => {});
  // the incoming deck is now the active one
  audio = incoming;
  idleDeck = outgoing;
  trackIdx = nextIndex;
  renderTrackMeta(nextIndex);
  const startedAt = performance.now();
  (function step(now) {
    if (!isFading) return;               // cancelled by a manual action
    const p = Math.min(1, (now - startedAt) / (fadeLen * 1000));
    incoming.volume = p;
    outgoing.volume = 1 - p;
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      outgoing.pause();
      outgoing.volume = 1;
      try { outgoing.currentTime = 0; } catch (_) {}
      isFading = false;
    }
  })(performance.now());
}

function onDeckTimeUpdate(e) {
  if (e.target !== audio) return;        // ignore the fading-out deck
  if (audio.duration && !isNaN(audio.duration)) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('tEl').textContent = fmt(audio.currentTime);
    document.getElementById('tDur').textContent = fmt(audio.duration);
  }
  maybeStartCrossfade();
}

function onDeckEnded(e) {
  if (e.target !== audio) return;        // the outgoing deck ending is expected during a fade
  if (isFading) return;
  nextTrack();                           // hard cut when crossfade is off / didn't trigger
}

function onDeckError(e) {
  if (e.target !== audio) return;
  document.getElementById('tDur').textContent = '—';
}

[audio, idleDeck].forEach((d) => {
  d.addEventListener('timeupdate', onDeckTimeUpdate);
  d.addEventListener('ended', onDeckEnded);
  d.addEventListener('error', onDeckError);
});

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Progress bar click
document.getElementById('progBar').addEventListener('click', (e) => {
  if (!audio.duration || isNaN(audio.duration)) return;
  if (isFading) cancelFade();
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// Visualizer
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function hsl(i, total, l) {
  return 'hsl(' + (((i / total) * 300 + colorOff) % 360) + ',100%,' + (l || '55%') + ')';
}

let dataArray = new Uint8Array(128);

function getData() {
  var phase = (performance.now() * 0.002) % (Math.PI * 2);
  colorOff += 0.08;
  for (var i = 0; i < dataArray.length; i++) {
    var wave = Math.sin(phase + i * 0.15) * 0.5 + 0.5;
    var rev = Math.abs(Math.sin(colorOff * 0.4 + i * 0.08)) * 0.5 + 0.5;
    var v = isPlaying ? wave * 180 + 40 : rev * 100 + 25;
    dataArray[i] = Math.floor(Math.min(255, v));
  }
  return dataArray;
}

function drawBars(d) {
  ctx.clearRect(0, 0, W, H);
  const count = 90;
  const bw = W / count - 1;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const bh = v * H * 0.6;
    const x = i * (bw + 1);
    const c = hsl(i, count);
    ctx.fillStyle = c;
    ctx.fillRect(x, H / 2 - bh, bw, bh);
    ctx.fillRect(x, H / 2, bw, bh * 0.3);
  }
}

function drawWave(d) {
  ctx.clearRect(0, 0, W, H);
  const sw = W / d.length;
  ctx.beginPath();
  for (let i = 0; i < d.length; i++) {
    const v = ((d[i] || 0) / 128 - 1) * 0.5;
    const y = v * H * 0.3 + H / 2;
    const x = i * sw;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = hsl(0, 1, '60%');
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawRadial(d) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const r = Math.min(W, H) * 0.2;
  const count = 120;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const ang = (i / count) * Math.PI * 2 - Math.PI / 2;
    const bh = v * Math.min(W, H) * 0.25;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    ctx.lineTo(cx + Math.cos(ang) * (r + bh), cy + Math.sin(ang) * (r + bh));
    ctx.strokeStyle = hsl(i, count);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawIdle() {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var count = 80;
  var r0 = Math.min(W, H) * 0.18;
  for (var i = 0; i < count; i++) {
    var ang = (i / count) * Math.PI * 2 + colorOff * 0.3;
    var pulse = Math.sin(colorOff * 2 + i * 0.2) * 0.5 + 0.5;
    var bh = pulse * Math.min(W, H) * 0.1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang) * (r0 + bh), cy + Math.sin(ang) * (r0 + bh));
    ctx.strokeStyle = 'hsla(' + ((i / count) * 360 + colorOff * 40) % 360 + ',80%,55%,' + (0.35 + pulse * 0.45) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

let vizAccentFrameSkip = 0;

function getVizUiHue() {
  const mode = MODES[modeIdx];
  let h;
  if (mode === 'Bars') {
    h = (((45 / 90) * 300 + colorOff) % 360 + 360) % 360;
  } else if (mode === 'Wave') {
    h = (((0 / 1) * 300 + colorOff) % 360 + 360) % 360;
  } else {
    h = (((60 / 120) * 300 + colorOff) % 360 + 360) % 360;
  }
  return h;
}

function syncVizButtonAccent() {
  const el = document.getElementById('vizBtn');
  if (!el) return;
  const h = getVizUiHue();
  el.style.setProperty('--viz-ui', 'hsl(' + h + ', 100%, 58%)');
  el.style.setProperty('--viz-ui-soft', 'hsla(' + h + ', 100%, 52%, 0.38)');
}

function render() {
  colorOff += 0.3;
  const d = getData();
  if (isPlaying && d.some(v => v > 10)) {
    if (MODES[modeIdx] === 'Bars') drawBars(d);
    else if (MODES[modeIdx] === 'Wave') drawWave(d);
    else drawRadial(d);
  } else {
    drawIdle();
  }
  if ((vizAccentFrameSkip++ % 15) === 0) syncVizButtonAccent();
  requestAnimationFrame(render);
}

setVizButtonDisplay();
syncVizButtonAccent();

loadPlaylist();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

document.getElementById('upNextSearchInput')?.addEventListener('input', applyUpNextFilter);

document.addEventListener('keydown', (e) => {
  const catModal = document.getElementById('catalogueMobileModal');
  if (catModal && catModal.classList.contains('show')) {
    if (e.code === 'Escape') {
      closeCatalogueMobileModal();
      return;
    }
  }
  const searchModal = document.getElementById('searchModal');
  if (searchModal && searchModal.classList.contains('show')) {
    if (e.code === 'Escape') {
      closeCatalogSearch();
      return;
    }
  }
  const modal = document.getElementById('upNextModal');
  if (modal && modal.classList.contains('show')) {
    if (e.code === 'Escape') {
      closeUpNext();
      return;
    }
    const focusInSearch = document.activeElement?.id === 'upNextSearchInput';
    if (!focusInSearch) {
      if (e.code === 'ArrowDown') {
        const visible = getVisibleTrackIndices();
        const idx = visible.indexOf(upNextActiveIndex);
        if (idx < visible.length - 1) upNextActiveIndex = visible[idx + 1];
        else if (visible.length) upNextActiveIndex = visible[visible.length - 1];
        updateUpNextFocus();
        e.preventDefault();
        return;
      }
      if (e.code === 'ArrowUp') {
        const visible = getVisibleTrackIndices();
        const idx = visible.indexOf(upNextActiveIndex);
        if (idx > 0) upNextActiveIndex = visible[idx - 1];
        else if (visible.length) upNextActiveIndex = visible[0];
        updateUpNextFocus();
        e.preventDefault();
        return;
      }
      if (e.code === 'Enter') {
        loadTrack(upNextActiveIndex);
        closeUpNext();
        e.preventDefault();
        return;
      }
    }
  }
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextTrack();
  if (e.code === 'ArrowLeft') prevTrack();
  if (e.code === 'KeyV') cycleViz();
  if (e.code === 'KeyS') shuffle();
});
</script>
