<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MRMELO — Nostalgia Player | Your Tapes, Your Vibes | mrmelo.com</title>
  <meta name="description" content="Stream your favourite decades—80s, 90s, 2000s, folk, and MrMelo Mix. A nostalgia player that remembers what you loved. mrmelo.com">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MRMELO">
  <meta property="og:title" content="MRMELO — Nostalgia Player | mrmelo.com">
  <meta property="og:description" content="Stream your favourite decades—80s, 90s, 2000s, folk, and MrMelo Mix. A nostalgia player that remembers what you loved.">
  <meta property="og:url" content="https://mrmelo.com">
  <meta property="og:image" content="https://mrmelo.com/og-image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MRMELO — Nostalgia Player | mrmelo.com">
  <meta name="twitter:description" content="Stream your favourite decades—80s, 90s, 2000s, folk, and MrMelo Mix. A nostalgia player that remembers what you loved.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Share+Tech+Mono&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070707;
      --text: rgba(255,255,255,0.88);
      --dim: rgba(255,255,255,0.28);
      --accent: #00ffe1;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { font-size:16px; -webkit-text-size-adjust:100%; }
    html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Share Tech Mono',monospace; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    #viz { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

    .scan {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
    }

    .vig {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.75) 100%);
    }

    .top {
      position:fixed; top:0; left:0; right:0; z-index:10;
      padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 16px max(20px,env(safe-area-inset-left));
      background:linear-gradient(to bottom,rgba(7,7,7,0.96),transparent);
      display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;
    }

    .top-left {
      display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    }

    .logo {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.4rem,4vw,2rem);
      letter-spacing:6px;
      color:var(--accent);
      text-shadow:0 0 24px var(--accent),0 0 50px rgba(0,255,225,0.2);
      line-height:1;
    }

    .catalogue-wrap {
      display:flex; flex-direction:column; gap:6px;
    }
    .catalogue-wrap label {
      font-size:0.65rem;
      letter-spacing:3px;
      color:var(--accent);
      text-transform:uppercase;
      opacity:0.9;
    }
    .catalogue-select {
      background:rgba(0,0,0,0.5);
      border:2px solid rgba(0,255,225,0.4);
      color:#fff;
      font-family:'Share Tech Mono',monospace;
      font-size:0.85rem;
      letter-spacing:2px;
      padding:10px 16px;
      cursor:pointer;
      min-width:180px;
      min-height:44px;
      box-shadow:0 0 12px rgba(0,255,225,0.15);
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .catalogue-select:hover, .catalogue-select:focus {
      border-color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,225,0.3);
      outline:none;
    }

    .catalogue-dropdown {
      position:relative;
      min-width:180px;
    }
    .catalogue-trigger {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      background:rgba(0,0,0,0.5);
      border:2px solid rgba(0,255,225,0.4);
      color:#fff;
      font-family:'Share Tech Mono',monospace;
      font-size:0.85rem;
      letter-spacing:2px;
      padding:10px 16px;
      cursor:pointer;
      min-height:44px;
      box-shadow:0 0 12px rgba(0,255,225,0.15);
      transition:border-color 0.2s, box-shadow 0.2s;
      text-align:left;
    }
    .catalogue-trigger:hover,
    .catalogue-trigger:focus,
    .catalogue-dropdown.open .catalogue-trigger {
      border-color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,225,0.3);
      outline:none;
    }
    .catalogue-arrow {
      font-size:0.6rem;
      color:var(--accent);
      opacity:0.8;
      transition:transform 0.2s;
    }
    .catalogue-dropdown.open .catalogue-arrow {
      transform:rotate(180deg);
    }
    .catalogue-menu {
      position:absolute;
      top:100%;
      left:0;
      right:0;
      margin-top:4px;
      background:var(--bg);
      border:2px solid rgba(0,255,225,0.4);
      box-shadow:0 0 24px rgba(0,0,0,0.6), 0 0 12px rgba(0,255,225,0.15);
      z-index:50;
      opacity:0;
      visibility:hidden;
      transform:translateY(-4px);
      transition:opacity 0.2s, visibility 0.2s, transform 0.2s;
    }
    .catalogue-dropdown.open .catalogue-menu {
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }
    .catalogue-option {
      padding:10px 16px;
      font-family:'Share Tech Mono',monospace;
      font-size:0.85rem;
      letter-spacing:2px;
      color:rgba(255,255,255,0.9);
      cursor:pointer;
      transition:background 0.15s, color 0.15s;
      border-bottom:1px solid rgba(255,255,255,0.04);
    }
    .catalogue-option:last-child {
      border-bottom:none;
    }
    .catalogue-option:hover {
      background:rgba(0,255,225,0.08);
      color:var(--accent);
    }
    .catalogue-option.selected {
      background:rgba(0,255,225,0.12);
      color:var(--accent);
      border-left:3px solid var(--accent);
      padding-left:13px;
    }

    .btn-nav {
      background:rgba(0,0,0,0.5);
      border:2px solid rgba(0,255,225,0.4);
      color:var(--accent);
      font-family:'Share Tech Mono',monospace;
      font-size:0.75rem;
      letter-spacing:2px;
      text-transform:uppercase;
      padding:10px 18px;
      cursor:pointer;
      min-height:44px;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .btn-nav:hover {
      border-color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,225,0.3);
    }

    /* Up Next modal */
    .modal-backdrop {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,0.85);
      opacity:0;
      visibility:hidden;
      transition:opacity 0.3s, visibility 0.3s;
    }
    .modal-backdrop.show {
      opacity:1;
      visibility:visible;
    }

    .modal {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:min(92vw, 480px);
      max-height:80vh;
      background:var(--bg);
      border:2px solid rgba(0,255,225,0.3);
      box-shadow:0 0 40px rgba(0,255,225,0.1);
      z-index:101;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.3s, visibility 0.3s;
    }
    .modal.show {
      opacity:1;
      visibility:visible;
    }

    .modal-header {
      padding:20px 24px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:1.4rem;
      letter-spacing:4px;
      color:var(--accent);
    }
    .modal-order {
      font-size:0.55rem;
      letter-spacing:2px;
      color:var(--dim);
      text-transform:uppercase;
    }
    .modal-close {
      background:none;
      border:none;
      color:var(--dim);
      font-size:1.2rem;
      cursor:pointer;
      padding:4px 8px;
    }
    .modal-close:hover {
      color:var(--accent);
    }

    .modal-list {
      max-height:60vh;
      overflow-y:auto;
    }
    .modal-track {
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 24px;
      cursor:pointer;
      border-bottom:1px solid rgba(255,255,255,0.04);
      transition:background 0.2s;
    }
    .modal-track:hover {
      background:rgba(0,255,225,0.06);
    }
    .modal-track.current {
      background:rgba(0,255,225,0.1);
      border-left:3px solid var(--accent);
    }
    .modal-track-num {
      font-size:0.6rem;
      color:var(--dim);
      min-width:28px;
    }
    .modal-track-info {
      flex:1;
      min-width:0;
    }
    .modal-track-title {
      font-family:'DM Serif Display',serif;
      font-style:italic;
      font-size:0.95rem;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modal-track-artist {
      font-size:0.55rem;
      letter-spacing:1px;
      color:var(--dim);
    }

    .genre-tag {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:5; text-align:center; pointer-events:none;
      opacity:0; transition:opacity 1.5s ease;
    }
    .genre-tag.show { opacity:1; }

    .genre-name {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(3rem,12vw,8rem);
      letter-spacing:8px;
      color:rgba(255,255,255,0.04);
      text-transform:uppercase;
      line-height:1;
    }

    .subtitle {
      position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
      z-index:10; text-align:center; max-width:600px; width:90%;
      opacity:0; transition:opacity 1.8s ease; pointer-events:none;
    }
    .subtitle.show { opacity:1; }

    .subtitle-quote {
      font-family:'DM Serif Display',serif;
      font-style:italic;
      font-size:clamp(1rem,2.8vw,1.4rem);
      color:rgba(255,255,255,0.82);
      line-height:1.5;
      text-shadow:0 2px 20px rgba(0,0,0,0.8);
    }

    .subtitle-sig {
      margin-top:8px;
      font-family:'Caveat',cursive;
      font-size:0.9rem;
      color:var(--accent);
      opacity:0.7;
      letter-spacing:1px;
    }

    .bottom {
      position:fixed; bottom:0; left:0; right:0; z-index:10;
      padding:16px max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
      background:linear-gradient(to top,rgba(7,7,7,0.97),transparent);
    }

    .track-row {
      display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
      margin-bottom:12px; flex-wrap:wrap;
    }

    .track-name {
      font-family:'DM Serif Display',serif;
      font-style:italic;
      font-size:clamp(0.95rem,2.5vw,1.3rem);
      color:#fff;
      max-width:55%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .track-artist {
      font-size:0.6rem;
      letter-spacing:2px;
      color:var(--dim);
      text-transform:uppercase;
    }

    .prog-row {
      display:flex; align-items:center; gap:12px;
      margin-bottom:14px;
    }

    .t-label { font-size:0.6rem; color:var(--dim); width:34px; flex-shrink:0; }
    .t-label:last-child { text-align:right; }

    .prog-bar {
      flex:1; height:8px;
      margin:0 4px;
      background:rgba(255,255,255,0.08);
      border-radius:4px; cursor:pointer; position:relative;
    }
    .prog-fill {
      height:100%; background:var(--accent);
      border-radius:2px; width:0%;
      box-shadow:0 0 8px var(--accent);
      transition:width 0.2s linear;
    }

    .ctrl-row {
      display:flex; align-items:center;
      justify-content:center; gap:16px;
    }

    .btn {
      background:none; border:none; cursor:pointer;
      font-family:'Share Tech Mono',monospace;
      font-size:0.6rem; letter-spacing:2px;
      text-transform:uppercase;
      color:var(--dim); padding:12px 16px;
      min-height:44px; min-width:44px;
      transition:color 0.2s, text-shadow 0.2s;
    }
    .btn:hover { color:#fff; }
    .btn.glow { color:var(--accent); text-shadow:0 0 10px var(--accent); }

    .play-btn {
      width:56px; height:56px;
      border-radius:50%;
      border:1.5px solid rgba(255,255,255,0.2);
      color:#fff; font-size:1rem;
      display:flex; align-items:center; justify-content:center;
      padding:0; transition:all 0.2s;
    }
    .play-btn:hover {
      border-color:var(--accent);
      color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,225,0.25);
    }

    .mode-badge {
      position:fixed; top:20px; left:50%;
      transform:translateX(-50%);
      z-index:10;
      font-size:0.55rem;
      letter-spacing:3px;
      color:var(--dim);
      text-transform:uppercase;
      transition:color 0.5s;
    }

    @media(max-width:500px) {
      .top-left { flex-direction:column; align-items:flex-start; }
      .catalogue-dropdown { min-width:100%; }
      .track-name { max-width:100%; }
      .subtitle { bottom:200px; }
      .ctrl-row { gap:12px; }
      .modal { width:100%; max-height:85vh; }
    }

    @media(max-width:380px) {
      .top { padding:12px 16px; }
      .bottom { padding:12px 16px 20px; }
    }
  </style>
</head>
<body>

<canvas id="viz"></canvas>

<div class="scan"></div>
<div class="vig"></div>

<div class="top">
  <div class="top-left">
    <div>
      <div class="logo">MRMELO VIBES</div>
      <div style="font-size:0.52rem;letter-spacing:2px;color:var(--dim);margin-top:4px;text-transform:uppercase;">Nostalgia Player</div>
    </div>
    <div class="catalogue-wrap">
      <label for="catalogue-trigger">Catalogue</label>
      <div class="catalogue-dropdown" id="catalogueDropdown">
        <button type="button" class="catalogue-trigger" id="catalogueTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="catalogue-value" id="catalogueDisplay">Entire catalogue</span>
          <span class="catalogue-arrow">▼</span>
        </button>
        <div class="catalogue-menu" id="catalogueMenu" role="listbox" aria-hidden="true">
          <div class="catalogue-option selected" data-value="">Entire catalogue</div>
          <div class="catalogue-option" data-value="80s">80s</div>
          <div class="catalogue-option" data-value="90s">90s</div>
          <div class="catalogue-option" data-value="2000">2000</div>
          <div class="catalogue-option" data-value="folk">Folk</div>
          <div class="catalogue-option" data-value="MrMelo Mix">MrMelo Mix</div>
        </div>
      </div>
      <input type="hidden" id="catalogue" value="">
    </div>
    <button class="btn-nav" id="upNextBtn" onclick="openUpNext()">Up Next</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeUpNext()"></div>
<div class="modal" id="upNextModal">
  <div class="modal-header">
    <div>
      <div class="modal-title">Up Next</div>
      <div class="modal-order" id="modalOrder">—</div>
    </div>
    <button class="modal-close" onclick="closeUpNext()" aria-label="Close">&times;</button>
  </div>
  <div class="modal-list" id="modalList"></div>
</div>

<div class="mode-badge" id="modeBadge">Bars</div>

<div class="genre-tag" id="genreTag">
  <div class="genre-name" id="genreWatermark">—</div>
</div>

<div class="subtitle" id="subtitle">
  <div class="subtitle-quote" id="subtitleQuote"></div>
  <div class="subtitle-sig" id="subtitleSig">— Mr. Melo</div>
</div>

<div class="bottom">
  <div class="track-row">
    <div>
      <div class="track-name" id="trackName">Loading…</div>
      <div class="track-artist" id="trackArtist">MRMELO VIBES</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:0.55rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;" id="trackNum">—</div>
    </div>
  </div>
  <div class="prog-row">
    <span class="t-label" id="tEl">0:00</span>
    <div class="prog-bar" id="progBar">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <span class="t-label" id="tDur">0:00</span>
  </div>
  <div class="ctrl-row">
    <button class="btn" onclick="prevTrack()">Prev</button>
    <button class="btn play-btn" id="playBtn" onclick="togglePlay()">&#9658;</button>
    <button class="btn" onclick="nextTrack()">Next</button>
    <button class="btn" onclick="shuffle()" id="shuffleBtn">Shuffle</button>
    <button class="btn" onclick="cycleViz()" id="vizBtn">Viz</button>
  </div>
</div>

<audio id="audio"></audio>

<script>
let ALL_TRACKS = [];
let playlist = [];
let trackIdx = 0;
let isPlaying = false;
let isShuffled = false;

const MODES = ['Bars','Wave','Radial'];
let modeIdx = 0;
let colorOff = 0;

async function loadPlaylist() {
  try {
    const r = await fetch('playlist.json');
    ALL_TRACKS = await r.json();
    applyCatalogue();
  } catch (e) {
    document.getElementById('trackName').textContent = 'No playlist found. Add playlist.json.';
    playlist = [];
  }
}

function applyCatalogue() {
  const cat = document.getElementById('catalogue').value;
  playlist = cat
    ? ALL_TRACKS.filter(t => t.catalogue === cat)
    : [...ALL_TRACKS];
  trackIdx = 0;
  if (playlist.length > 0) {
    loadTrack(0);
    document.getElementById('genreWatermark').textContent = cat || 'All';
    const tag = document.getElementById('genreTag');
    tag.classList.add('show');
    setTimeout(() => tag.classList.remove('show'), 3000);
  } else {
    document.getElementById('trackName').textContent = 'No tracks in this catalogue';
  }
}

function loadTrack(i) {
  if (!playlist[i]) return;
  trackIdx = i;
  const t = playlist[i];

  document.getElementById('trackName').textContent = t.title;
  document.getElementById('trackArtist').textContent = t.artist + ' · ' + t.catalogue;
  document.getElementById('trackNum').textContent = (i + 1) + ' / ' + playlist.length;
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('tEl').textContent = '0:00';
  document.getElementById('tDur').textContent = '0:00';

  document.getElementById('subtitle').classList.remove('show');
  document.getElementById('subtitleQuote').textContent = '';
  document.getElementById('subtitleSig').textContent = t.figure ? '— ' + t.figure : '— Mr. Melo';
  setTimeout(() => {
    document.getElementById('subtitleQuote').textContent = t.reflection || '';
    if (t.reflection) document.getElementById('subtitle').classList.add('show');
  }, 600);

  audio.crossOrigin = t.file.startsWith('http') ? null : 'anonymous';
  audio.src = t.file;
  audio.load();
  if (isPlaying) audio.play().catch(() => {});
}

function showSubtitle(text) {
  const el = document.getElementById('subtitle');
  const q = document.getElementById('subtitleQuote');
  el.classList.remove('show');
  setTimeout(() => {
    q.textContent = text;
    if (text) el.classList.add('show');
  }, 300);
}

function nextTrack() {
  if (!playlist.length) return;
  loadTrack((trackIdx + 1) % playlist.length);
}

function prevTrack() {
  if (!playlist.length) return;
  loadTrack((trackIdx - 1 + playlist.length) % playlist.length);
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9658;';
  if (isPlaying) audio.play().catch(() => {});
  else audio.pause();
}

function shuffle() {
  if (!playlist.length) return;
  isShuffled = !isShuffled;
  document.getElementById('shuffleBtn').classList.toggle('glow', isShuffled);
  if (isShuffled) {
    for (let i = playlist.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
    }
  } else {
    const cat = document.getElementById('catalogue').value;
    playlist = cat ? ALL_TRACKS.filter(t => t.catalogue === cat) : [...ALL_TRACKS];
  }
  loadTrack(0);
}

function cycleViz() {
  modeIdx = (modeIdx + 1) % MODES.length;
  document.getElementById('modeBadge').textContent = MODES[modeIdx];
  document.getElementById('vizBtn').textContent = MODES[modeIdx];
}

function openUpNext() {
  const cat = document.getElementById('catalogue').value;
  const orderLabel = isShuffled ? 'Order: Shuffled' : (cat ? 'Order: Catalogue (' + cat + ')' : 'Order: Entire catalogue');
  document.getElementById('modalOrder').textContent = orderLabel;

  const list = document.getElementById('modalList');
  list.innerHTML = '';
  const max = 50;
  const slice = playlist.slice(0, max);
  slice.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'modal-track' + (i === trackIdx ? ' current' : '');
    row.dataset.index = String(i);
    row.innerHTML =
      '<span class="modal-track-num">' + (i + 1) + '</span>' +
      '<div class="modal-track-info">' +
        '<div class="modal-track-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="modal-track-artist">' + escapeHtml(t.artist) + '</div>' +
      '</div>';
    row.addEventListener('click', () => {
      loadTrack(i);
      closeUpNext();
    });
    list.appendChild(row);
  });
  if (playlist.length > max) {
    const more = document.createElement('div');
    more.style.cssText = 'padding:12px 24px;font-size:0.6rem;color:var(--dim);';
    more.textContent = '+ ' + (playlist.length - max) + ' more tracks';
    list.appendChild(more);
  }

  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('upNextModal').classList.add('show');
}

function closeUpNext() {
  document.getElementById('modalBackdrop').classList.remove('show');
  document.getElementById('upNextModal').classList.remove('show');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

// Audio events
const audio = document.getElementById('audio');

audio.addEventListener('timeupdate', () => {
  if (audio.duration && !isNaN(audio.duration)) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('tEl').textContent = fmt(audio.currentTime);
    document.getElementById('tDur').textContent = fmt(audio.duration);
  }
});

audio.addEventListener('ended', nextTrack);

audio.addEventListener('error', () => {
  document.getElementById('tDur').textContent = '—';
});

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Progress bar click
document.getElementById('progBar').addEventListener('click', (e) => {
  if (!audio.duration || isNaN(audio.duration)) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// Catalogue custom dropdown
const catalogueDropdown = document.getElementById('catalogueDropdown');
const catalogueTrigger = document.getElementById('catalogueTrigger');
const catalogueDisplay = document.getElementById('catalogueDisplay');
const catalogueInput = document.getElementById('catalogue');
const catalogueMenu = document.getElementById('catalogueMenu');
const catalogueOptions = catalogueMenu.querySelectorAll('.catalogue-option');

function openCatalogue() {
  catalogueDropdown.classList.add('open');
  catalogueTrigger.setAttribute('aria-expanded', 'true');
  catalogueMenu.setAttribute('aria-hidden', 'false');
}

function closeCatalogue() {
  catalogueDropdown.classList.remove('open');
  catalogueTrigger.setAttribute('aria-expanded', 'false');
  catalogueMenu.setAttribute('aria-hidden', 'true');
}

function selectCatalogue(value) {
  const label = value === '' ? 'Entire catalogue' : value;
  catalogueInput.value = value;
  catalogueDisplay.textContent = label;
  catalogueOptions.forEach((opt) => {
    opt.classList.toggle('selected', opt.dataset.value === value);
  });
  closeCatalogue();
  applyCatalogue();
}

catalogueTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  if (catalogueDropdown.classList.contains('open')) {
    closeCatalogue();
  } else {
    openCatalogue();
  }
});

catalogueOptions.forEach((opt) => {
  opt.addEventListener('click', (e) => {
    e.stopPropagation();
    selectCatalogue(opt.dataset.value);
  });
});

document.addEventListener('click', () => {
  if (catalogueDropdown.classList.contains('open')) closeCatalogue();
});

document.addEventListener('keydown', (e) => {
  if (catalogueDropdown.classList.contains('open') && e.code === 'Escape') {
    closeCatalogue();
  }
});

// Visualizer
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function hsl(i, total, l) {
  return 'hsl(' + (((i / total) * 300 + colorOff) % 360) + ',100%,' + (l || '55%') + ')';
}

let analyser, dataArray;

try {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const src = ac.createMediaElementSource(audio);
  analyser = ac.createAnalyser();
  analyser.fftSize = 256;
  src.connect(analyser);
  analyser.connect(ac.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
} catch (e) {
  dataArray = new Uint8Array(128);
}

function getData() {
  if (analyser) {
    analyser.getByteFrequencyData(dataArray);
  } else {
    colorOff += 0.1;
    for (let i = 0; i < dataArray.length; i++) {
      dataArray[i] = Math.abs(Math.sin(colorOff * 0.5 + i * 0.1)) * 80 + 20;
    }
  }
  return dataArray;
}

function drawBars(d) {
  ctx.clearRect(0, 0, W, H);
  const count = 90;
  const bw = W / count - 1;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const bh = v * H * 0.6;
    const x = i * (bw + 1);
    const c = hsl(i, count);
    ctx.fillStyle = c;
    ctx.fillRect(x, H / 2 - bh, bw, bh);
    ctx.fillRect(x, H / 2, bw, bh * 0.3);
  }
}

function drawWave(d) {
  ctx.clearRect(0, 0, W, H);
  const sw = W / d.length;
  ctx.beginPath();
  for (let i = 0; i < d.length; i++) {
    const v = ((d[i] || 0) / 128 - 1) * 0.5;
    const y = v * H * 0.3 + H / 2;
    const x = i * sw;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = hsl(0, 1, '60%');
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawRadial(d) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const r = Math.min(W, H) * 0.2;
  const count = 120;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const ang = (i / count) * Math.PI * 2 - Math.PI / 2;
    const bh = v * Math.min(W, H) * 0.25;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    ctx.lineTo(cx + Math.cos(ang) * (r + bh), cy + Math.sin(ang) * (r + bh));
    ctx.strokeStyle = hsl(i, count);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawIdle() {
  ctx.clearRect(0, 0, W, H);
  colorOff += 0.02;
  const cx = W / 2, cy = H / 2;
  const count = 80;
  for (let i = 0; i < count; i++) {
    const ang = (i / count) * Math.PI * 2;
    const r0 = Math.min(W, H) * 0.15;
    const pulse = Math.sin(colorOff * 2 + i * 0.15) * 0.5 + 0.5;
    const bh = pulse * Math.min(W, H) * 0.08;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang) * (r0 + bh), cy + Math.sin(ang) * (r0 + bh));
    ctx.strokeStyle = 'hsla(' + ((i / count) * 300 + colorOff * 50) % 360 + ',100%,60%,' + (0.3 + pulse * 0.5) + ')';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function render() {
  colorOff += 0.3;
  const d = getData();
  if (isPlaying && d.some(v => v > 10)) {
    if (MODES[modeIdx] === 'Bars') drawBars(d);
    else if (MODES[modeIdx] === 'Wave') drawWave(d);
    else drawRadial(d);
  } else {
    drawIdle();
  }
  requestAnimationFrame(render);
}

document.getElementById('modeBadge').textContent = MODES[modeIdx];
document.getElementById('vizBtn').textContent = MODES[modeIdx];

loadPlaylist();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('upNextModal');
  if (modal && modal.classList.contains('show') && e.code === 'Escape') {
    closeUpNext();
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextTrack();
  if (e.code === 'ArrowLeft') prevTrack();
  if (e.code === 'KeyV') cycleViz();
  if (e.code === 'KeyS') shuffle();
});
</script>
