          <button type="button" class="catalogue-tile selected" data-value="" aria-pressed="true">Entire catalogue</button>
          <button type="button" class="catalogue-tile" data-value="80s" aria-pressed="false">80s</button>
          <button type="button" class="catalogue-tile" data-value="90s" aria-pressed="false">90s</button>
          <button type="button" class="catalogue-tile" data-value="2000" aria-pressed="false">2000</button>
          <button type="button" class="catalogue-tile" data-value="folk" aria-pressed="false">Folk</button>
          <button type="button" class="catalogue-tile" data-value="MrMelo Mix" aria-pressed="false">MrMelo Mix</button>
          <button type="button" class="catalogue-tile" data-value="Oldies and Goldies" aria-pressed="false">Oldies and Goldies</button>
          <button type="button" class="catalogue-tile" data-value="Summer Dance" aria-pressed="false">Summer Dance</button>
        </div>
      </fieldset>
      <input type="hidden" id="catalogue" value="">
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeUpNext()"></div>
<div class="modal" id="upNextModal">
  <div class="modal-header">
    <div>
      <div class="modal-title">Up Next</div>
      <div class="modal-order" id="modalOrder">—</div>
    </div>
    <div class="modal-header-actions">
      <button type="button" class="modal-restore-btn" onclick="restoreQueueOrder()" aria-label="Restore queue to catalogue order">Restore order</button>
      <button class="modal-close" onclick="closeUpNext()" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="modal-search-wrap" style="padding:0 24px 12px;">
    <input type="text" id="upNextSearchInput" class="search-input" placeholder="Search in queue…" autocomplete="off" aria-label="Filter queue by title or artist" style="min-width:0;width:100%;">
  </div>
  <div class="modal-list" id="modalList" role="listbox" aria-label="Up next queue" tabindex="0"></div>
</div>

<div class="genre-tag" id="genreTag">
  <div class="genre-name" id="genreWatermark">—</div>
</div>

<div class="subtitle" id="subtitle">
  <div class="subtitle-quote" id="subtitleQuote"></div>
  <div class="subtitle-sig" id="subtitleSig">— Mr. Melo</div>
</div>

<div class="bottom">
  <div class="track-row">
    <div>
      <div class="track-name" id="trackName">Loading…</div>
      <div class="track-artist" id="trackArtist">MRMELO VIBES</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:0.55rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;" id="trackNum">—</div>
    </div>
  </div>
  <div class="prog-row">
    <span class="t-label" id="tEl">0:00</span>
    <div class="prog-bar" id="progBar">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <span class="t-label" id="tDur">0:00</span>
  </div>
  <div class="ctrl-row">
    <div class="search-wrap search-wrap--ctrl">
      <label for="searchInput">Search</label>
      <input type="text" id="searchInput" class="search-input" placeholder="Song or artist…" autocomplete="off" aria-label="Search songs by title or artist">
    </div>
    <button type="button" class="btn btn-transport" onclick="prevTrack()">Prev</button>
    <button type="button" class="btn play-btn" id="playBtn" onclick="togglePlay()">&#9658;</button>
    <button type="button" class="btn btn-transport" onclick="nextTrack()">Next</button>
    <button type="button" class="btn btn-transport" onclick="shuffle()" id="shuffleBtn">Shuffle</button>
    <button type="button" class="btn btn-viz" onclick="cycleViz()" id="vizBtn">Bars</button>
    <button type="button" class="btn-nav" id="upNextBtn" onclick="openUpNext()">Up Next</button>
  </div>
</div>

<audio id="audio" playsinline webkit-playsinline preload="metadata"></audio>

<script>
let ALL_TRACKS = [];
let playlist = [];
let queue = [];
let trackIdx = 0;
let upNextActiveIndex = 0;
let isPlaying = false;
let isShuffled = false;

const MODES = ['Bars','Wave','Radial'];
let modeIdx = 0;
let colorOff = 0;

async function loadPlaylist() {
  try {
    const r = await fetch('playlist.json');
    ALL_TRACKS = await r.json();
    applyCatalogue();
  } catch (e) {
    document.getElementById('trackName').textContent = 'No playlist found. Add playlist.json.';
    playlist = [];
    queue = [];
  }
}

function applyCatalogue() {
  const cat = document.getElementById('catalogue').value;
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  playlist = cat
    ? ALL_TRACKS.filter(t => t.catalogue === cat)
    : [...ALL_TRACKS];
  if (q) {
    playlist = playlist.filter(t =>
      (t.title && t.title.toLowerCase().includes(q)) ||
      (t.artist && t.artist.toLowerCase().includes(q))
    );
  }
  queue = [...playlist];
  trackIdx = 0;
  if (queue.length > 0) {
    loadTrack(0);
    document.getElementById('genreWatermark').textContent = cat || 'All';
    const tag = document.getElementById('genreTag');
    tag.classList.add('show');
    setTimeout(() => tag.classList.remove('show'), 3000);
  } else {
    document.getElementById('trackName').textContent = q
      ? 'No tracks match your search'
      : 'No tracks in this catalogue';
  }
}

function loadTrack(i) {
  if (!queue[i]) return;
  trackIdx = i;
  const t = queue[i];

  document.getElementById('trackName').textContent = t.title;
  document.getElementById('trackArtist').textContent = t.artist + ' · ' + t.catalogue;
  document.getElementById('trackNum').textContent = (i + 1) + ' / ' + queue.length;
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('tEl').textContent = '0:00';
  document.getElementById('tDur').textContent = '0:00';

  document.getElementById('subtitle').classList.remove('show');
  document.getElementById('subtitleQuote').textContent = '';
  document.getElementById('subtitleSig').textContent = t.figure ? '— ' + t.figure : '— Mr. Melo';
  setTimeout(() => {
    document.getElementById('subtitleQuote').textContent = t.reflection || '';
    if (t.reflection) document.getElementById('subtitle').classList.add('show');
  }, 600);

  audio.crossOrigin = t.file.startsWith('http') ? null : 'anonymous';
  audio.src = t.file;
  audio.load();
  if (isPlaying) {
    audio.play().then(() => {}).catch((e) => {
      if (e && e.name === 'NotAllowedError') {
        isPlaying = false;
        document.getElementById('playBtn').innerHTML = '&#9658;';
      }
    });
  }
}

function showSubtitle(text) {
  const el = document.getElementById('subtitle');
  const q = document.getElementById('subtitleQuote');
  el.classList.remove('show');
  setTimeout(() => {
    q.textContent = text;
    if (text) el.classList.add('show');
  }, 300);
}

function nextTrack() {
  if (!queue.length) return;
  loadTrack((trackIdx + 1) % queue.length);
}

function prevTrack() {
  if (!queue.length) return;
  loadTrack((trackIdx - 1 + queue.length) % queue.length);
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9658;';
  if (isPlaying) {
    audio.play().then(() => {}).catch((e) => {
      if (e && e.name === 'NotAllowedError') {
        isPlaying = false;
        document.getElementById('playBtn').innerHTML = '&#9658;';
      }
    });
  } else {
    audio.pause();
  }
}

function shuffle() {
  if (!queue.length) return;
  isShuffled = !isShuffled;
  document.getElementById('shuffleBtn').classList.toggle('glow', isShuffled);
  if (isShuffled) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
  } else {
    queue = [...playlist];
  }
  loadTrack(0);
}

function cycleViz() {
  modeIdx = (modeIdx + 1) % MODES.length;
  document.getElementById('vizBtn').textContent = MODES[modeIdx];
  syncVizButtonAccent();
}

function playNext(queueIndex) {
  if (!queue[queueIndex]) return;
  const t = queue[queueIndex];
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  const insertAt = trackIdx + 1;
  queue.splice(insertAt, 0, t);
  if (queueIndex === trackIdx) loadTrack(trackIdx);
  refreshUpNextList();
}

function addToEnd(queueIndex) {
  if (!queue[queueIndex]) return;
  const t = queue[queueIndex];
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  queue.push(t);
  if (queueIndex === trackIdx) loadTrack(trackIdx);
  refreshUpNextList();
}

function removeFromQueue(queueIndex) {
  if (!queue[queueIndex]) return;
  queue.splice(queueIndex, 1);
  if (queueIndex < trackIdx) trackIdx--;
  if (queue.length === 0) {
    trackIdx = 0;
    document.getElementById('trackName').textContent = 'Queue empty';
    document.getElementById('trackArtist').textContent = '—';
    document.getElementById('trackNum').textContent = '0 / 0';
    audio.pause();
    isPlaying = false;
    document.getElementById('playBtn').innerHTML = '&#9658;';
  } else {
    if (queueIndex === trackIdx || trackIdx >= queue.length) {
      trackIdx = Math.min(trackIdx, queue.length - 1);
      loadTrack(trackIdx);
    }
  }
  refreshUpNextList();
  if (queue.length === 0) closeUpNext();
}

function restoreQueueOrder() {
  const currentTrack = queue[trackIdx];
  queue = [...playlist];
  if (queue.length === 0) return;
  const idx = currentTrack ? queue.findIndex((t) => t.file === currentTrack.file) : -1;
  trackIdx = idx >= 0 ? idx : 0;
  loadTrack(trackIdx);
  refreshUpNextList();
}

function moveQueueItem(fromIdx, toIdx) {
  if (fromIdx === toIdx || !queue[fromIdx]) return;
  const item = queue.splice(fromIdx, 1)[0];
  const insertIdx = fromIdx < toIdx ? toIdx - 1 : toIdx;
  queue.splice(insertIdx, 0, item);
  if (fromIdx === trackIdx) {
    trackIdx = insertIdx;
  } else if (fromIdx < trackIdx) {
    trackIdx = insertIdx >= trackIdx ? trackIdx - 1 : trackIdx;
  } else {
    trackIdx = insertIdx <= trackIdx ? trackIdx + 1 : trackIdx;
  }
  refreshUpNextList();
}

function buildUpNextListContent() {
  const list = document.getElementById('modalList');
  if (!list) return;
  list.innerHTML = '';
  upNextActiveIndex = Math.min(upNextActiveIndex, queue.length - 1);
  if (upNextActiveIndex < 0) upNextActiveIndex = 0;

  queue.forEach((t, i) => {
    const row = document.createElement('div');
    row.id = 'modal-track-' + i;
    row.className = 'modal-track' + (i === trackIdx ? ' current' : '') + (i === upNextActiveIndex ? ' focused' : '');
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', i === trackIdx ? 'true' : 'false');
    row.dataset.index = String(i);
    row.draggable = true;
    const durStr = (t.duration != null && !isNaN(t.duration)) ? fmt(t.duration) : '';
    row.innerHTML =
      '<span class="modal-track-drag-handle" aria-hidden="true" title="Drag to reorder">⋮⋮</span>' +
      '<span class="modal-track-num">' + (i + 1) + '</span>' +
      '<div class="modal-track-info">' +
        '<div class="modal-track-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="modal-track-artist">' + escapeHtml(t.artist) + '</div>' +
      '</div>' +
      '<span class="modal-track-catalogue">' + escapeHtml(t.catalogue || '') + '</span>' +
      '<span class="modal-track-duration">' + escapeHtml(durStr) + '</span>' +
      '<div class="modal-track-actions">' +
        '<button type="button" class="modal-queue-btn" title="Play next">Next</button>' +
        '<button type="button" class="modal-queue-btn" title="Add to end">End</button>' +
        '<button type="button" class="modal-queue-btn modal-queue-btn-remove" title="Remove from queue">Remove</button>' +
      '</div>';
    row.addEventListener('click', (e) => {
      if (e.target.closest('.modal-queue-btn') || e.target.closest('.modal-track-drag-handle')) return;
      loadTrack(i);
      closeUpNext();
    });
    const btns = row.querySelectorAll('.modal-queue-btn');
    if (btns[0]) btns[0].addEventListener('click', (e) => { e.stopPropagation(); playNext(i); });
    if (btns[1]) btns[1].addEventListener('click', (e) => { e.stopPropagation(); addToEnd(i); });
    if (btns[2]) btns[2].addEventListener('click', (e) => { e.stopPropagation(); removeFromQueue(i); });
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      list.querySelectorAll('.modal-track.drag-over').forEach((r) => { if (r !== row) r.classList.remove('drag-over'); });
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      const to = parseInt(row.dataset.index, 10);
      if (!isNaN(from) && !isNaN(to) && from !== to) moveQueueItem(from, to);
    });
    list.appendChild(row);
  });

  list.setAttribute('aria-activedescendant', 'modal-track-' + upNextActiveIndex);
}

function refreshUpNextList() {
  if (!document.getElementById('upNextModal')?.classList.contains('show')) return;
  buildUpNextListContent();
  applyUpNextFilter();
  const currentRow = document.getElementById('modal-track-' + trackIdx);
  if (currentRow) currentRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function openUpNext() {
  const cat = document.getElementById('catalogue').value;
  const orderLabel = isShuffled ? 'Order: Shuffled' : (cat ? 'Order: Catalogue (' + cat + ')' : 'Order: Entire catalogue');
  document.getElementById('modalOrder').textContent = orderLabel;

  upNextActiveIndex = trackIdx;
  buildUpNextListContent();

  const searchInput = document.getElementById('upNextSearchInput');
  if (searchInput) searchInput.value = '';
  applyUpNextFilter();

  const currentRow = document.getElementById('modal-track-' + trackIdx);
  if (currentRow) currentRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('upNextModal').classList.add('show');
  document.getElementById('modalList').focus();
}

function closeUpNext() {
  document.getElementById('modalBackdrop').classList.remove('show');
  document.getElementById('upNextModal').classList.remove('show');
  const upNextBtn = document.getElementById('upNextBtn');
  if (upNextBtn) upNextBtn.focus();
}

function getVisibleTrackIndices() {
  const list = document.getElementById('modalList');
  if (!list) return [];
  const indices = [];
  list.querySelectorAll('.modal-track:not(.filtered-out)').forEach((row) => {
    const i = parseInt(row.dataset.index, 10);
    if (!isNaN(i)) indices.push(i);
  });
  return indices;
}

function applyUpNextFilter() {
  const q = (document.getElementById('upNextSearchInput')?.value || '').trim().toLowerCase();
  const list = document.getElementById('modalList');
  if (!list) return;
  list.querySelectorAll('.modal-track').forEach((row) => {
    const i = parseInt(row.dataset.index, 10);
    const t = queue[i];
    if (!t) return;
    const match = !q ||
      (t.title && t.title.toLowerCase().includes(q)) ||
      (t.artist && t.artist.toLowerCase().includes(q)) ||
      (t.catalogue && t.catalogue.toLowerCase().includes(q));
    row.classList.toggle('filtered-out', !match);
  });
  const visible = getVisibleTrackIndices();
  if (visible.length && visible.indexOf(upNextActiveIndex) === -1) {
    upNextActiveIndex = visible[0];
    updateUpNextFocus();
  }
}

function updateUpNextFocus() {
  const list = document.getElementById('modalList');
  if (!list || !list.closest('.modal')?.classList.contains('show')) return;
  list.querySelectorAll('.modal-track').forEach((row) => row.classList.remove('focused'));
  const activeRow = document.getElementById('modal-track-' + upNextActiveIndex);
  if (activeRow && !activeRow.classList.contains('filtered-out')) {
    activeRow.classList.add('focused');
    activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  list.setAttribute('aria-activedescendant', 'modal-track-' + upNextActiveIndex);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

// Audio events
const audio = document.getElementById('audio');

audio.addEventListener('timeupdate', () => {
  if (audio.duration && !isNaN(audio.duration)) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('tEl').textContent = fmt(audio.currentTime);
    document.getElementById('tDur').textContent = fmt(audio.duration);
  }
});

audio.addEventListener('ended', nextTrack);

audio.addEventListener('error', () => {
  document.getElementById('tDur').textContent = '—';
});

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Progress bar click
document.getElementById('progBar').addEventListener('click', (e) => {
  if (!audio.duration || isNaN(audio.duration)) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// Catalogue tiles
const catalogueInput = document.getElementById('catalogue');
const catalogueTiles = document.querySelectorAll('.catalogue-tile');

function tileValue(btn) {
  return btn.getAttribute('data-value') === null ? '' : btn.getAttribute('data-value');
}

function selectCatalogue(value) {
  catalogueInput.value = value;
  catalogueTiles.forEach((btn) => {
    const v = tileValue(btn);
    const on = v === value;
    btn.classList.toggle('selected', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  applyCatalogue();
}

catalogueTiles.forEach((btn) => {
  btn.addEventListener('click', () => selectCatalogue(tileValue(btn)));
});

document.getElementById('searchInput').addEventListener('input', applyCatalogue);
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    document.getElementById('searchInput').value = '';
    applyCatalogue();
  }
});

// Visualizer
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function hsl(i, total, l) {
  return 'hsl(' + (((i / total) * 300 + colorOff) % 360) + ',100%,' + (l || '55%') + ')';
}

let dataArray = new Uint8Array(128);

function getData() {
  var phase = (performance.now() * 0.002) % (Math.PI * 2);
  colorOff += 0.08;
  for (var i = 0; i < dataArray.length; i++) {
    var wave = Math.sin(phase + i * 0.15) * 0.5 + 0.5;
    var rev = Math.abs(Math.sin(colorOff * 0.4 + i * 0.08)) * 0.5 + 0.5;
    var v = isPlaying ? wave * 180 + 40 : rev * 100 + 25;
    dataArray[i] = Math.floor(Math.min(255, v));
  }
  return dataArray;
}

function drawBars(d) {
  ctx.clearRect(0, 0, W, H);
  const count = 90;
  const bw = W / count - 1;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const bh = v * H * 0.6;
    const x = i * (bw + 1);
    const c = hsl(i, count);
    ctx.fillStyle = c;
    ctx.fillRect(x, H / 2 - bh, bw, bh);
    ctx.fillRect(x, H / 2, bw, bh * 0.3);
  }
}

function drawWave(d) {
  ctx.clearRect(0, 0, W, H);
  const sw = W / d.length;
  ctx.beginPath();
  for (let i = 0; i < d.length; i++) {
    const v = ((d[i] || 0) / 128 - 1) * 0.5;
    const y = v * H * 0.3 + H / 2;
    const x = i * sw;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = hsl(0, 1, '60%');
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawRadial(d) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const r = Math.min(W, H) * 0.2;
  const count = 120;
  const step = Math.max(1, Math.floor(d.length / count));
  for (let i = 0; i < count; i++) {
    const v = (d[i * step] || 0) / 255;
    const ang = (i / count) * Math.PI * 2 - Math.PI / 2;
    const bh = v * Math.min(W, H) * 0.25;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    ctx.lineTo(cx + Math.cos(ang) * (r + bh), cy + Math.sin(ang) * (r + bh));
    ctx.strokeStyle = hsl(i, count);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawIdle() {
  ctx.clearRect(0, 0, W, H);
  var cx = W / 2, cy = H / 2;
  var count = 80;
  var r0 = Math.min(W, H) * 0.18;
  for (var i = 0; i < count; i++) {
    var ang = (i / count) * Math.PI * 2 + colorOff * 0.3;
    var pulse = Math.sin(colorOff * 2 + i * 0.2) * 0.5 + 0.5;
    var bh = pulse * Math.min(W, H) * 0.1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    ctx.lineTo(cx + Math.cos(ang) * (r0 + bh), cy + Math.sin(ang) * (r0 + bh));
    ctx.strokeStyle = 'hsla(' + ((i / count) * 360 + colorOff * 40) % 360 + ',80%,55%,' + (0.35 + pulse * 0.45) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

let vizAccentFrameSkip = 0;

function getVizUiHue() {
  const mode = MODES[modeIdx];
  let h;
  if (mode === 'Bars') {
    h = (((45 / 90) * 300 + colorOff) % 360 + 360) % 360;
  } else if (mode === 'Wave') {
    h = (((0 / 1) * 300 + colorOff) % 360 + 360) % 360;
  } else {
    h = (((60 / 120) * 300 + colorOff) % 360 + 360) % 360;
  }
  return h;
}

function syncVizButtonAccent() {
  const el = document.getElementById('vizBtn');
  if (!el) return;
  const h = getVizUiHue();
  el.style.setProperty('--viz-ui', 'hsl(' + h + ', 100%, 58%)');
  el.style.setProperty('--viz-ui-soft', 'hsla(' + h + ', 100%, 52%, 0.38)');
}

function render() {
  colorOff += 0.3;
  const d = getData();
  if (isPlaying && d.some(v => v > 10)) {
    if (MODES[modeIdx] === 'Bars') drawBars(d);
    else if (MODES[modeIdx] === 'Wave') drawWave(d);
    else drawRadial(d);
  } else {
    drawIdle();
  }
  if ((vizAccentFrameSkip++ % 15) === 0) syncVizButtonAccent();
  requestAnimationFrame(render);
}

document.getElementById('vizBtn').textContent = MODES[modeIdx];
syncVizButtonAccent();

loadPlaylist();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

document.getElementById('upNextSearchInput')?.addEventListener('input', applyUpNextFilter);

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('upNextModal');
  if (modal && modal.classList.contains('show')) {
    if (e.code === 'Escape') {
      closeUpNext();
      return;
    }
    const focusInSearch = document.activeElement?.id === 'upNextSearchInput';
    if (!focusInSearch) {
      if (e.code === 'ArrowDown') {
        const visible = getVisibleTrackIndices();
        const idx = visible.indexOf(upNextActiveIndex);
        if (idx < visible.length - 1) upNextActiveIndex = visible[idx + 1];
        else if (visible.length) upNextActiveIndex = visible[visible.length - 1];
        updateUpNextFocus();
        e.preventDefault();
        return;
      }
      if (e.code === 'ArrowUp') {
        const visible = getVisibleTrackIndices();
        const idx = visible.indexOf(upNextActiveIndex);
        if (idx > 0) upNextActiveIndex = visible[idx - 1];
        else if (visible.length) upNextActiveIndex = visible[0];
        updateUpNextFocus();
        e.preventDefault();
        return;
      }
      if (e.code === 'Enter') {
        loadTrack(upNextActiveIndex);
        closeUpNext();
        e.preventDefault();
        return;
      }
    }
  }
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextTrack();
  if (e.code === 'ArrowLeft') prevTrack();
  if (e.code === 'KeyV') cycleViz();
  if (e.code === 'KeyS') shuffle();
});
</script>

</body>
</html>
